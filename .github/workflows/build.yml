name: Build
# Builds the branch that was pushed: master publishes into binaries (the branch
# the release tags point at), rx-timestamps into binaries-rx-timestamps,
# leaving master's binaries untouched. A push to a ci/** branch or a manual run
# builds and tests only (nothing is published).
on:
  push:
    branches: [ master, rx-timestamps, 'ci/**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Build in Docker (Debian 11, glibc 2.31)
        env:
          SECRET: ${{ secrets.SECRET }}
        run: |
          # 1) Write the script that will run *inside* the container
          cat > docker_build.sh << 'EOF'
          #!/usr/bin/env bash
          set -ex

          echo "=== Inside container ==="
          uname -m || true
          ldd --version | head -n1 || true

          # The image is the official gcc:11.5.0-bullseye: Debian 11 (glibc 2.31, the
          # oldest glibc the binaries must run on) with GCC 11.5 installed under
          # /usr/local and the system gcc/g++ diverted to it. Node 24's V8 headers use
          # C++20 <source_location>, which needs libstdc++ 11: having it in the image
          # keeps the build off the Ubuntu toolchain PPA on Launchpad, whose outages
          # (503 on the index and on package downloads) killed whole builds.
          gcc --version | head -n1

          # Debian 11 is end-of-life: its packages live on archive.debian.org for good,
          # while deb.debian.org still serves the old index but no longer the security
          # pool (every download there is a 404). Use the archive, whose Release files
          # are past their validity date by design.
          printf 'deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n' > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::Check-Valid-Until=false"
          apt-get update $APT
          apt-get install -y $APT wget gnupg ca-certificates curl git make zlib1g-dev binutils

          # LLVM repo for clang-18 on Debian 11 (bullseye); key as a plain file, no apt-key
          wget -qO /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-18 main" > /etc/apt/sources.list.d/llvm.list
          apt-get update $APT
          apt-get install -y $APT clang-18 lld-18 llvm-18-dev libclang-18-dev

          # The apt clang would pick Debian's GCC 10 under /usr/lib/gcc (pulled in as a
          # dependency); point it at the image's GCC 11 instead, so its libstdc++ 11
          # headers and static libstdc++ are the ones compiled and linked. build.c
          # calls clang-18/clang++-18 by name: these wrappers on PATH add the flag.
          GCC_INSTALL_DIR="$(dirname "$(gcc -print-libgcc-file-name)")"
          for t in clang-18 clang++-18; do
            printf '#!/bin/sh\nexec /usr/bin/%s --gcc-install-dir=%s "$@"\n' "$t" "$GCC_INSTALL_DIR" > /usr/local/bin/$t
            chmod +x /usr/local/bin/$t
          done
          clang++-18 -v 2>&1 | grep -i "gcc installation"
          printf '#include <source_location>\nint main() { return std::source_location::current().line() > 0 ? 0 : 1; }\n' > /tmp/sl.cpp
          clang++-18 -std=c++20 -static-libstdc++ /tmp/sl.cpp -o /tmp/sl && /tmp/sl && echo "libstdc++ 11 headers and static library in use"

          # BoringSSL needs CMake >= 3.22; bullseye's apt only has 3.18. Install from
          # the official Kitware tarball (multi-arch, runs on old glibc)
          CMAKE_V=3.29.6
          case "$(uname -m)" in
            aarch64) CMAKE_ARCH=aarch64 ;;
            *)       CMAKE_ARCH=x86_64 ;;
          esac
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_V}/cmake-${CMAKE_V}-linux-${CMAKE_ARCH}.tar.gz" | tar xz -C /usr/local --strip-components=1
          cmake --version

          # The nested cmake builds (BoringSSL, lsquic) use the image's GCC 11
          export CC=gcc
          export CXX=g++
          $CC --version | head -n1
          $CXX --version | head -n1

          # Install Node.js 24 LTS from the official tarball (multi-arch, works on
          # arm64 + amd64, includes npm, no third-party apt repo to go stale)
          NODE_V=v24.15.0
          case "$(uname -m)" in
            aarch64) NODE_ARCH=arm64 ;;
            *)       NODE_ARCH=x64 ;;
          esac
          curl -fsSL "https://nodejs.org/dist/${NODE_V}/node-${NODE_V}-linux-${NODE_ARCH}.tar.gz" | tar xz -C /usr/local --strip-components=1
          node --version
          npm --version

          git clone --depth 1 --recursive --branch "$SOURCE_BRANCH" https://github.com/GSKruschewsky/uWebSockets.js.git
          cd uWebSockets.js
          SOURCE_COMMIT=$(git rev-parse HEAD)
          if [ "$SOURCE_BRANCH" = master ]; then BIN_BRANCH=binaries; else BIN_BRANCH="binaries-${SOURCE_BRANCH}"; fi

          make
          ls dist

          cd tests
          npm install ws
          node smoke.js
          node rxtimestamps.js
          node messageview.js
          node hostname.js
          node resolve-error.js
          node connect-overlap.js
          node connect-timeout.js
          node sni.js
          cd ..

          ls dist
          # Every binary must keep running on glibc 2.31 hosts
          for f in dist/*.node; do
            echo "$f needs up to $(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1)"
          done

          if [ "$PUBLISH" != yes ]; then
            echo "Build and tests passed; not publishing (branch $SOURCE_BRANCH, event $EVENT_NAME)"
            exit 0
          fi

          git config --global user.email "61966264+GSKruschewsky@users.noreply.github.com"
          git config --global user.name "GSKruschewsky"
          # The noreply address: GitHub rejects pushes whose commits carry a private email (GH007)

          # Publish to the binaries branch. Both matrix jobs push here around the
          # same time, so never force-push: build the commit on the freshly fetched
          # tip and retry on rejection, otherwise one arch silently clobbers the
          # other's freshly pushed binaries.
          pushed=""
          for attempt in 1 2 3 4 5; do
            # The branch's binaries branch, seeded from master's on the first run
            git fetch origin "$BIN_BRANCH" || git fetch origin binaries
            git checkout -B "$BIN_BRANCH" FETCH_HEAD

            # Remove old binaries for this arch before adding the new ones
            case "$GITHUB_OS" in
              ubuntu-24.04-arm)
                # ARM64 binaries
                git rm -f uws_linux_arm64_*.node 2>/dev/null || true
                ;;
              ubuntu-24.04)
                # x64 binaries
                git rm -f uws_linux_x64_*.node 2>/dev/null || true
                ;;
            esac

            # Copy newly built binaries & JS wrapper from dist
            cp dist/*.node .
            cp dist/*.js .

            # Store the source commit that was built
            echo "$SOURCE_COMMIT" > source_commit
            ls

            # Get index.d.ts from the built commit and write it as a top-level file
            git show "$SOURCE_COMMIT":docs/index.d.ts > index.d.ts

            # Stage new binaries + index.d.ts + source_commit
            git add uws*.node uws.js index.d.ts source_commit

            git status

            git commit -m "[GitHub Actions] Updated ${GITHUB_OS} binaries" || true

            if git push "https://GSKruschewsky:${SECRET}@github.com/GSKruschewsky/uWebSockets.js" "$BIN_BRANCH"; then
              pushed="yes"
              break
            fi
            echo "Push rejected (concurrent update from the other arch); retrying"
            sleep $(( (RANDOM % 10) + 2 ))
          done

          if [ -z "$pushed" ]; then
            echo "Failed to push binaries after 5 attempts"
            exit 1
          fi
          EOF

          chmod +x docker_build.sh

          # 2) Run that script inside the gcc:11.5.0-bullseye image (glibc 2.31).
          # Only a push to master or rx-timestamps publishes binaries.
          PUBLISH=no
          if [ "${{ github.event_name }}" = push ] && { [ "${{ github.ref_name }}" = master ] || [ "${{ github.ref_name }}" = rx-timestamps ]; }; then PUBLISH=yes; fi
          docker run --rm \
            -e SECRET="$SECRET" \
            -e GITHUB_OS="${{ matrix.os }}" \
            -e SOURCE_BRANCH="${{ github.ref_name }}" \
            -e EVENT_NAME="${{ github.event_name }}" \
            -e PUBLISH="$PUBLISH" \
            -v "$PWD:/work" \
            -w /work \
            gcc:11.5.0-bullseye \
            /work/docker_build.sh
