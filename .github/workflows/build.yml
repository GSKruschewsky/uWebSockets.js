name: Build
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Build in Docker (glibc 2.31)
        env:
          SECRET: ${{ secrets.SECRET }}
        run: |
          # 1) Write the script that will run *inside* the container
          cat > docker_build.sh << 'EOF'
          #!/usr/bin/env bash
          set -ex

          echo "=== Inside container ==="
          uname -m || true
          ldd --version | head -n1 || true

          apt-get update
          apt-get install -y wget gnupg ca-certificates software-properties-common

          # LLVM repo for clang-18 on Ubuntu 20.04 (focal)
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-18 main" > /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
          apt-get update
          
          # Toolchain + Node for smoke test
          apt-get install -y git build-essential make curl clang-18 lld-18 llvm-18-dev libclang-18-dev zlib1g-dev

          # BoringSSL needs CMake >= 3.22; focal's apt only has 3.16. Install from
          # the official Kitware tarball (multi-arch, runs on old glibc)
          CMAKE_V=3.29.6
          case "$(uname -m)" in
            aarch64) CMAKE_ARCH=aarch64 ;;
            *)       CMAKE_ARCH=x86_64 ;;
          esac
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_V}/cmake-${CMAKE_V}-linux-${CMAKE_ARCH}.tar.gz" | tar xz -C /usr/local --strip-components=1
          cmake --version

          # Newer GCC (GCC 11) for C++20 <source_location>.
          # add-apt-repository resolves the PPA signing key over HKP against
          # keyserver.ubuntu.com, which times out regularly and has killed whole
          # builds. Configure the PPA by hand instead: repo line plus the signing
          # key fetched over plain HTTPS from the Launchpad API.
          echo "deb https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main" > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list
          curl -fsSL "https://api.launchpad.net/devel/~ubuntu-toolchain-r/+archive/ubuntu/test?ws.op=getSigningKeyData" \
            | python3 -c 'import sys, json; sys.stdout.write(json.load(sys.stdin))' \
            > /etc/apt/trusted.gpg.d/ubuntu-toolchain-r-test.asc
          apt-get update
          apt-get install -y gcc-11 g++-11
          
          # Set globally so all nested build systems use the right compiler
          export CC=gcc-11
          export CXX=g++-11
          
          # Verify
          $CC --version
          $CXX --version

          # Install Node.js 24 LTS from the official tarball (multi-arch, works on
          # arm64 + amd64, includes npm, no third-party apt repo to go stale)
          NODE_V=v24.15.0
          case "$(uname -m)" in
            aarch64) NODE_ARCH=arm64 ;;
            *)       NODE_ARCH=x64 ;;
          esac
          curl -fsSL "https://nodejs.org/dist/${NODE_V}/node-${NODE_V}-linux-${NODE_ARCH}.tar.gz" | tar xz -C /usr/local --strip-components=1
          node --version
          npm --version

          git clone --depth 1 --recursive https://github.com/GSKruschewsky/uWebSockets.js.git
          cd uWebSockets.js

          make
          ls dist

          cd tests
          npm install ws
          node smoke.js
          cd ..

          ls dist

          git config --global user.email "luhkynaat@gmail.com"
          git config --global user.name "GSKruschewsky"

          # Publish to the binaries branch. Both matrix jobs push here around the
          # same time, so never force-push: build the commit on the freshly fetched
          # tip and retry on rejection, otherwise one arch silently clobbers the
          # other's freshly pushed binaries.
          pushed=""
          for attempt in 1 2 3 4 5; do
            git fetch origin binaries
            git checkout -B binaries FETCH_HEAD

            # Remove old binaries for this arch before adding the new ones
            case "$GITHUB_OS" in
              ubuntu-24.04-arm)
                # ARM64 binaries
                git rm -f uws_linux_arm64_*.node 2>/dev/null || true
                ;;
              ubuntu-24.04)
                # x64 binaries
                git rm -f uws_linux_x64_*.node 2>/dev/null || true
                ;;
            esac

            # Copy newly built binaries & JS wrapper from dist
            cp dist/*.node .
            cp dist/*.js .

            # Store the source commit from master
            git rev-parse master > source_commit
            ls

            # Get index.d.ts from master and write it as a top-level file
            git show master:docs/index.d.ts > index.d.ts

            # Stage new binaries + index.d.ts + source_commit
            git add uws*.node uws.js index.d.ts source_commit

            git status

            git commit -m "[GitHub Actions] Updated ${GITHUB_OS} binaries" || true

            if git push "https://GSKruschewsky:${SECRET}@github.com/GSKruschewsky/uWebSockets.js" binaries; then
              pushed="yes"
              break
            fi
            echo "Push rejected (concurrent update from the other arch); retrying"
            sleep $(( (RANDOM % 10) + 2 ))
          done

          if [ -z "$pushed" ]; then
            echo "Failed to push binaries after 5 attempts"
            exit 1
          fi
          EOF

          chmod +x docker_build.sh

          # 2) Run that script inside ubuntu:20.04
          docker run --rm \
            -e SECRET="$SECRET" \
            -e GITHUB_OS="${{ matrix.os }}" \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:20.04 \
            /work/docker_build.sh
